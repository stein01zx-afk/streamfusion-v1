<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StreamFusion — Control de directos</title>
  <link rel="stylesheet" href="style.css"><script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <section class="auth-screen" id="authScreen">
    <div class="auth-art"><span class="logo-mark">S</span><p class="eyebrow">STREAMFUSION STUDIO</p><h1>Tu directo,<br><em>en una sola señal.</em></h1><p>Conecta tus canales, diseña overlays y lleva tu comunidad a escena.</p><div class="orbit one"></div><div class="orbit two"></div></div>
    <form class="auth-card" id="authForm"><div class="brand-line"><span class="logo-mark small">S</span><strong>StreamFusion</strong></div><h2 id="authTitle">Bienvenido de vuelta</h2><p id="authText">Inicia sesión para abrir tu estudio.</p><label class="auth-name hidden">Nombre visible<input id="authName" maxlength="50" placeholder="Tu nombre"></label><label>Correo<input id="authEmail" type="email" required placeholder="tu@correo.com"></label><label>Contraseña<input id="authPassword" type="password" required minlength="8" placeholder="Mínimo 8 caracteres"></label><button class="btn primary full" id="authSubmit">Entrar al estudio <span>→</span></button><button class="link-btn" type="button" id="authToggle">¿No tienes cuenta? Crear cuenta</button><p class="form-error" id="authError"></p></form>
  </section>

  <div class="app hidden" id="app">
    <aside class="sidebar" id="sidebar"><div class="side-brand"><span class="logo-mark small">S</span><span>StreamFusion</span><button class="collapse" id="collapse" aria-label="Contraer menú">‹</button></div>
      <nav id="nav"><p class="nav-label">ESTUDIO</p><button class="nav-item active" data-page="dashboard"><i>⌂</i><span>Dashboard</span></button><button class="nav-item" data-page="connections"><i>⌁</i><span>Conexiones</span></button><p class="nav-label">CREACIÓN</p><button class="nav-item" data-page="customize"><i>✦</i><span>Personalización</span></button><button class="nav-item" data-page="overlays"><i>▣</i><span>Overlays</span></button><button class="nav-item" data-page="roulette"><i>◉</i><span>Ruleta</span></button><button class="nav-item" data-page="widgets"><i>♬</i><span>Widgets</span></button><p class="nav-label">CUENTA</p><button class="nav-item" data-page="settings"><i>⚙</i><span>Ajustes</span></button></nav>
      <div class="side-user"><span class="user-avatar" id="userInitial">A</span><div><strong id="userName">Creador</strong><small>Plan Studio</small></div><button id="logout" title="Cerrar sesión">↪</button></div>
    </aside>
    <main><header class="topbar"><div><p class="eyebrow" id="pageKicker">TU ESTUDIO</p><h1 id="pageTitle">Dashboard</h1></div><div class="connected-accounts" id="topAccounts"></div><button class="btn primary" data-page="connections">＋ Conectar canal</button></header><div class="welcome" id="welcome"></div><section id="view" class="view"></section></main>
  </div>
  <template id="dashboardTpl"><div class="hero"><div><span class="live-dot"></span> ESTUDIO LISTO<h2>Todo lo que pasa en tu live,<br><em>sin perder el ritmo.</em></h2><p>Conecta un canal para empezar a recibir comentarios, regalos y eventos en tiempo real.</p><button class="btn primary" data-page="connections">Conectar mi primer canal →</button></div><div class="hero-stat"><strong id="liveCount">0</strong><span>canales activos</span><div class="wave">⌁⌁⌁⌁⌁⌁⌁</div></div></div><div class="metric-grid"><article><span>◌</span><small>Mensajes</small><strong id="messageCount">0</strong><em>en esta sesión</em></article><article><span>♡</span><small>Eventos</small><strong id="eventCount">0</strong><em>en esta sesión</em></article><article><span>◈</span><small>Regalos</small><strong id="giftCount">0</strong><em>en esta sesión</em></article></div><div class="dashboard-grid"><section class="card feed"><header><div><p class="eyebrow">EN VIVO</p><h3>Chat unificado</h3></div><select id="chatFilter"><option value="all">Todos los canales</option><option value="tiktok">TikTok</option><option value="twitch">Twitch</option></select></header><div id="chatFeed" class="chat-feed"><div class="empty">Los comentarios recientes aparecerán aquí.<br><small>El feed mantiene el mensaje más nuevo a la vista.</small></div></div></section><section class="card activity"><header><div><p class="eyebrow">ACTIVIDAD</p><h3>Últimos eventos</h3></div></header><div id="eventFeed" class="event-feed"><div class="empty">Aún no hay eventos.</div></div></section></div></template>
  <script src="app.js"></script>
</body></html>
