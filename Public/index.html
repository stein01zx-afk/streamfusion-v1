<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFusion</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="welcomeOverlay" class="modal modal-open">
    <div class="welcomeCard">
      <div class="welcomeBrand">
        <div class="logoMark">SF</div>
        <div>
          <h1 data-i18n="welcome.title">StreamFusion</h1>
          <p data-i18n="welcome.subtitle">Conecta tus plataformas para comenzar</p>
        </div>
      </div>

      <div class="welcomeFields">
        <div class="field">
          <label for="welcomeTikTok" data-i18n="welcome.tiktok">TikTok Username</label>
          <input id="welcomeTikTok" type="text" placeholder="@username" autocomplete="off" />
        </div>

        <div class="field">
          <label for="welcomeTwitch" data-i18n="welcome.twitch">Twitch Username</label>
          <input id="welcomeTwitch" type="text" placeholder="channel" autocomplete="off" />
        </div>
      </div>

      <div class="welcomeActions">
        <button id="welcomeConnect" class="primaryBtn" data-i18n="welcome.connect">Conectar</button>
        <button id="welcomeOpenSettings" class="secondaryBtn" data-i18n="welcome.settings">Configuración</button>
      </div>

      <p class="welcomeHint" data-i18n="welcome.hint">Puedes conectar una o ambas plataformas</p>
    </div>
  </div>

  <div id="appShell" class="appShell hidden">
    <header class="topbar">
      <div class="brandWrap">
        <div class="logoMark small">SF</div>
        <div>
          <h1>StreamFusion</h1>
          <span data-i18n="topbar.tagline">Live dashboard</span>
        </div>
      </div>

      <div id="accountStrip" class="accountStrip"></div>

      <div id="viewerPill" class="viewerPill hidden" aria-live="polite">👁<span id="viewerCount">0</span></div>

      <div class="topbarActions">
        <button id="openOverlay" class="iconBtn" title="Overlay">🖥</button>
        <button id="openSettings" class="iconBtn" title="Settings">⚙</button>
      </div>
    </header>

    <section id="statsRail" class="statsRail hidden"></section>

    <main id="dashboard" class="dashboard layout-chat-only">
      <section id="chatPanel" class="panel chatPanel">
        <div class="panelHeader">
          <div>
            <h2 data-i18n="panel.chat">Chat</h2>
            <p data-i18n="panel.chat.subtitle">Mensajes en tiempo real</p>
          </div>
          <div class="segmented" id="chatFilter"></div>
        </div>
        <div id="chatList" class="itemList"></div>
      </section>

      <section id="rightColumn" class="rightColumn hidden">
        <section id="eventPanel" class="panel eventPanel hidden">
          <div class="panelHeader">
            <div>
              <h2 data-i18n="panel.events">Eventos</h2>
              <p data-i18n="panel.events.subtitle">Likes, follows, joins y shares</p>
            </div>
            <div class="segmented" id="eventFilter"></div>
          </div>
          <div id="eventList" class="itemList"></div>
        </section>

        <section id="giftPanel" class="panel giftPanel hidden">
          <div class="panelHeader">
            <div>
              <h2 data-i18n="panel.gifts">Regalos</h2>
              <p data-i18n="panel.gifts.subtitle">Gifts, fan club, subs, bits y raids</p>
            </div>
            <div class="segmented" id="giftFilter"></div>
          </div>
          <div id="giftList" class="itemList"></div>
        </section>
      </section>
    </main>
  </div>

  <div id="settingsModal" class="modal">
    <div class="settingsCard">
      <div class="settingsTop">
        <h2 data-i18n="settings.title">Configuración</h2>
        <button id="closeSettings" class="iconBtn closeBtn">✕</button>
      </div>

      <div class="tabs" id="settingsTabs">
        <button class="tab active" data-tab="general" data-i18n="settings.general">General</button>
        <button class="tab" data-tab="chat" data-i18n="settings.chat">Chat</button>
        <button class="tab" data-tab="events" data-i18n="settings.events">Eventos</button>
        <button class="tab" data-tab="gifts" data-i18n="settings.gifts">Regalos</button>
        <button class="tab" data-tab="panels" data-i18n="settings.panels">Paneles</button>
        <button class="tab" data-tab="appearance" data-i18n="settings.appearance">Apariencia</button>
      </div>

      <div class="tabPages">
        <div class="tabPage" id="tab-general">
          <div class="settingGrid">
            <label class="settingRow">
              <span data-i18n="settings.language">Idioma</span>
              <select id="languageSelect">
                <option value="es">Español</option>
                <option value="en">English</option>
              </select>
            </label>
            <label class="settingRow">
              <span data-i18n="settings.theme">Tema</span>
              <select id="themeSelect">
                <option value="dark">Dark</option>
                <option value="midnight">Midnight</option>
                <option value="purple">Purple</option>
              </select>
            </label>
            <label class="toggleRow"><input id="startMinimized" type="checkbox" /><span data-i18n="settings.startMinimized">Iniciar minimizado</span></label>
            <label class="toggleRow"><input id="playSounds" type="checkbox" checked /><span data-i18n="settings.sounds">Sonidos</span></label>
            <label class="toggleRow"><input id="saveLogs" type="checkbox" checked /><span data-i18n="settings.logs">Guardar historial</span></label>
          </div>
        </div>

        <div class="tabPage hidden" id="tab-chat">
          <div class="settingGrid">
            <label class="toggleRow"><input id="chatShowAvatar" type="checkbox" checked /><span data-i18n="chat.avatar">Mostrar avatar</span></label>
            <label class="toggleRow"><input id="chatShowUsername" type="checkbox" checked /><span data-i18n="chat.username">Mostrar username</span></label>
            <label class="toggleRow"><input id="chatShowPlatform" type="checkbox" checked /><span data-i18n="chat.platform">Mostrar plataforma</span></label>
            <label class="toggleRow"><input id="chatShowTime" type="checkbox" checked /><span data-i18n="chat.time">Mostrar hora</span></label>
            <label class="toggleRow"><input id="chatCompactMode" type="checkbox" /><span data-i18n="chat.compact">Modo compacto</span></label>
            <label class="settingRow">
              <span data-i18n="chat.style">Estilo</span>
              <select id="chatBubbleStyle">
                <option value="bubble" data-i18n="chat.style.bubble">Bubble</option>
                <option value="glass" data-i18n="chat.style.glass">Glass</option>
                <option value="minimal" data-i18n="chat.style.minimal">Minimal</option>
              </select>
            </label>
            <label class="settingRow">
              <span data-i18n="chat.max">Máximo mensajes</span>
              <input id="chatMaxMessages" type="number" min="20" max="300" step="5" value="120" />
            </label>
            <label class="toggleRow"><input id="chatAutoScroll" type="checkbox" checked /><span data-i18n="chat.autoscroll">Auto scroll inteligente</span></label>
            <label class="toggleRow"><input id="chatShowBadges" type="checkbox" checked /><span data-i18n="chat.badges">Mostrar insignias</span></label>
          </div>
        </div>

        <div class="tabPage hidden" id="tab-events">
          <div class="settingGrid">
            <label class="toggleRow"><input id="eventShowJoin" type="checkbox" checked /><span data-i18n="events.join">Se unió</span></label>
            <label class="toggleRow"><input id="eventShowLike" type="checkbox" checked /><span data-i18n="events.like">Likes</span></label>
            <label class="toggleRow"><input id="eventShowFollow" type="checkbox" checked /><span data-i18n="events.follow">Seguir</span></label>
            <label class="toggleRow"><input id="eventShowShare" type="checkbox" checked /><span data-i18n="events.share">Compartió</span></label>
            <label class="toggleRow"><input id="eventShowSystem" type="checkbox" checked /><span data-i18n="events.system">Sistema</span></label>
            <label class="toggleRow"><input id="eventShowViewer" type="checkbox" checked /><span data-i18n="events.viewer">Espectadores</span></label>
          </div>
        </div>

        <div class="tabPage hidden" id="tab-gifts">
          <div class="settingGrid">
            <label class="toggleRow"><input id="giftShowGift" type="checkbox" checked /><span data-i18n="gifts.gift">Regalos</span></label>
            <label class="toggleRow"><input id="giftShowFanClub" type="checkbox" checked /><span data-i18n="gifts.fanclub">Fan Club</span></label>
            <label class="toggleRow"><input id="giftShowSuperFan" type="checkbox" checked /><span data-i18n="gifts.superfan">Super Fan</span></label>
            <label class="toggleRow"><input id="giftShowEnvelope" type="checkbox" checked /><span data-i18n="gifts.envelope">Envelopes</span></label>
            <label class="toggleRow"><input id="giftShowSub" type="checkbox" checked /><span data-i18n="gifts.sub">Subs</span></label>
            <label class="toggleRow"><input id="giftShowBits" type="checkbox" checked /><span data-i18n="gifts.bits">Bits</span></label>
            <label class="toggleRow"><input id="giftShowRaid" type="checkbox" checked /><span data-i18n="gifts.raid">Raids</span></label>
          </div>
        </div>

        <div class="tabPage hidden" id="tab-panels">
          <div class="settingGrid">
            <label class="toggleRow"><input id="panelShowStats" type="checkbox" /><span data-i18n="panels.stats">Mostrar estadísticas</span></label>
            <label class="toggleRow"><input id="panelShowEvents" type="checkbox" /><span data-i18n="panels.events">Mostrar eventos</span></label>
            <label class="toggleRow"><input id="panelShowGifts" type="checkbox" /><span data-i18n="panels.gifts">Mostrar regalos</span></label>
          </div>
        </div>

        <div class="tabPage hidden" id="tab-appearance">
          <div class="settingGrid">
            <label class="settingRow">
              <span data-i18n="appearance.accent">Accent</span>
              <select id="accentSelect">
                <option value="cyan">Cyan</option>
                <option value="violet">Violet</option>
                <option value="pink">Pink</option>
                <option value="blue">Blue</option>
              </select>
            </label>
            <label class="settingRow">
              <span data-i18n="appearance.radius">Bordes</span>
              <select id="radiusSelect">
                <option value="14">14px</option>
                <option value="18" selected>18px</option>
                <option value="22">22px</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="settingsActions">
        <button id="resetSettings" class="secondaryBtn" data-i18n="settings.reset">Restaurar</button>
        <button id="saveSettings" class="primaryBtn" data-i18n="settings.save">Guardar</button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toastContainer"></div>

  <script src="app.js"></script>
  <script src="patch.js"></script>
</body>
</html>
