<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFusion Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{
      --bg:#070b14;
      --card:rgba(15,22,39,.78);
      --line:rgba(255,255,255,.08);
      --text:#f4f7ff;
      --muted:#98a5c7;
      --accent:#8b5cf6;
      --accent-2:#22c55e;
      --shadow:0 26px 70px rgba(0,0,0,.46);
      --radius:28px;
    }
    body[data-theme="tiktok-neon"]{ --bg:#090812; --card:rgba(20,18,32,.78); --accent:#ff4fa7; --accent-2:#29d7ff; }
    body[data-theme="matrix"]{ --bg:#051105; --card:rgba(8,25,8,.8); --accent:#37ff70; --accent-2:#00d46a; }
    body[data-theme="cyberpunk"]{ --bg:#090611; --card:rgba(24,18,39,.8); --accent:#f7d022; --accent-2:#ff4ecd; }
    body[data-theme="glass"]{ --bg:#07111d; --card:rgba(255,255,255,.10); --accent:#7c5cff; --accent-2:#15b8ff; }
    body[data-theme="twitch-dark"]{ --bg:#070b14; --card:rgba(15,22,39,.78); --accent:#8b5cf6; --accent-2:#22c55e; }

    body[data-font="inter"]{ font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    body[data-font="system"]{ font-family: system-ui, -apple-system, Segoe UI, Arial, sans-serif; }
    body[data-font="rounded"]{ font-family: ui-rounded, Quicksand, Segoe UI, Arial, sans-serif; }
    body[data-font="mono"]{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    body[data-font="serif"]{ font-family: Georgia, 'Times New Roman', Times, serif; }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      color:var(--text);
      background:
        radial-gradient(circle at 10% 10%, color-mix(in srgb, var(--accent) 28%, transparent), transparent 28%),
        radial-gradient(circle at 90% 15%, color-mix(in srgb, var(--accent-2) 22%, transparent), transparent 26%),
        linear-gradient(160deg, var(--bg), color-mix(in srgb, var(--bg) 70%, black));
      overflow:hidden;
    }

    .wrap{ height:100%; padding:18px; }
    .card{
      width:100%;
      height:100%;
      border-radius:34px;
      border:1px solid var(--line);
      background:linear-gradient(180deg, rgba(255,255,255,.06), transparent 20%), var(--card);
      backdrop-filter: blur(18px);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      flex:0 0 auto;
    }
    .title{ display:flex; flex-direction:column; gap:2px; min-width:0; }
    .title strong{ font-size:18px; }
    .title span{ font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .status{ font-size:12px; color:var(--muted); }

    .list{
      padding:16px;
      gap:12px;
      display:flex;
      flex-direction:column;
      min-height:0;
      overflow:auto;
      flex:1;
    }
    body.horizontal .list{
      flex-direction:row;
      align-items:stretch;
      overflow-x:auto;
      overflow-y:hidden;
      scroll-snap-type:x proximity;
    }

    .item{
      display:flex;
      gap:12px;
      padding:13px;
      border-radius:22px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.045);
      position:relative;
      overflow:hidden;
    }
    body.horizontal .item{
      min-width:320px;
      max-width:420px;
      flex:0 0 auto;
      scroll-snap-align:start;
      align-self:stretch;
    }
    body.compact .item{ padding:11px; }
    .item.enter{ animation:in .26s ease both; }
    .item.leaving{ animation:out .2s ease both; }

    .avatar{
      width:46px;
      height:46px;
      border-radius:16px;
      object-fit:cover;
      flex:0 0 auto;
      background:#111827;
      border:1px solid rgba(255,255,255,.12);
    }
    body.no-avatar-frame .avatar{ border-color:transparent; }
    body.hide-avatars .avatar{ display:none; }

    .content{ min-width:0; flex:1; }
    .top{ display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:6px; }
    .user{ font-size:15px; font-weight:800; }
    .handle,.time,.tag,.platformTag,.badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:24px;
      padding:4px 9px;
      border-radius:999px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.08);
      color:var(--muted);
      font-size:11px;
      line-height:1;
    }
    .platformTag.tiktok{ color:#ff6ea8; }
    .platformTag.twitch{ color:#ae8cff; }
    .badge{ padding:0 8px; }
    .badgeEmoji{ font-size:12px; }
    .badgeImage img{ width:16px; height:16px; object-fit:contain; display:block; }
    .text{ font-size:15px; line-height:1.45; word-break:break-word; }
    .twitchEmote{ width:28px; height:28px; vertical-align:-7px; object-fit:contain; }
    .emptyState{
      display:grid;
      place-items:center;
      min-height:160px;
      border:1px dashed rgba(255,255,255,.1);
      border-radius:24px;
      color:var(--muted);
      background:rgba(255,255,255,.02);
      text-align:center;
      padding:20px;
      margin:auto;
    }
    .emptyState strong{ color:var(--text); display:block; margin-bottom:6px; }
    .emptyState span{ font-size:13px; }

    body.horizontal .emptyState{ min-width:320px; }

    @keyframes in{ from{ opacity:0; transform:translateY(8px) scale(.985); } to{ opacity:1; transform:translateY(0) scale(1); } }
    @keyframes out{ from{ opacity:1; } to{ opacity:0; transform:translateY(-6px); height:0; padding-top:0; padding-bottom:0; margin:0; border-width:0; } }

    ::-webkit-scrollbar{ width:12px; height:12px; }
    ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.16); border-radius:999px; border:3px solid transparent; background-clip:padding-box; }
    ::-webkit-scrollbar-track{ background:transparent; }
  </style>
</head>
<body data-theme="twitch-dark" data-font="inter">
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="title">
          <strong id="title">Overlay Chat</strong>
          <span id="subtitle">Listo para capturar mensajes en vivo</span>
        </div>
        <div class="status" id="status">Conectando…</div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const title = document.getElementById('title');
    const subtitle = document.getElementById('subtitle');
    const params = new URLSearchParams(location.search);
    const saved = JSON.parse(localStorage.getItem('streamfusion.settings.v3') || '{}');
    const view = (params.get('view') || saved?.overlay?.defaultView || 'chat').toLowerCase();
    const horizontal = view === 'chat-horizontal';

    document.body.dataset.theme = saved?.appearance?.theme || 'twitch-dark';
    document.body.dataset.font = saved?.appearance?.font || 'inter';
    document.body.classList.toggle('no-avatar-frame', saved?.appearance?.avatarFrame === false);
    document.body.classList.toggle('hide-avatars', saved?.appearance?.showAvatars === false);
    document.body.classList.toggle('horizontal', horizontal);

    if (view === 'events') {
      title.textContent = 'Overlay Eventos';
      subtitle.textContent = 'Likes, follows, joins y acciones';
    } else if (view === 'gifts') {
      title.textContent = 'Overlay Regalos';
      subtitle.textContent = 'Subs, bits y gifts';
    } else if (horizontal) {
      title.textContent = 'Overlay Chat horizontal';
      subtitle.textContent = 'Mensajes en tarjetas laterales';
    } else {
      title.textContent = 'Overlay Chat';
      subtitle.textContent = 'Mensajes limpios con avatares y badges';
    }

    const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const time = (ts=Date.now()) => new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
    const avatar = (seed, platform) => {
      const label = String((platform || 'user') + '-' + (seed || 'guest')).slice(0, 18).replace(/[<>&"]/g, '');
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#2a3146"/>
              <stop offset="100%" stop-color="#0f1423"/>
            </linearGradient>
          </defs>
          <rect width="128" height="128" rx="32" fill="url(#g)"/>
          <circle cx="64" cy="54" r="23" fill="#c7d2fe" fill-opacity=".92"/>
          <path d="M26 108c7-22 25-34 38-34s31 12 38 34" fill="#c7d2fe" fill-opacity=".92"/>
          <circle cx="44" cy="48" r="4" fill="#0f1423"/>
          <circle cx="84" cy="48" r="4" fill="#0f1423"/>
          <path d="M51 62c4 5 22 5 26 0" fill="none" stroke="#0f1423" stroke-width="5" stroke-linecap="round"/>
          <text x="64" y="118" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#93a4c6">${label}</text>
        </svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    };

    function normalizeHandle(item){ return item.channel || item.uniqueId || item.user || item.displayName || item.login || ''; }
    function renderBadges(item){
      const badges = Array.isArray(item.badges) ? item.badges : [];
      if (!badges.length || saved?.appearance?.showBadges === false) return '';
      if (item.platform === 'twitch' && saved?.appearance?.showTwitchBadges === false) return '';
      if (item.platform === 'tiktok' && saved?.appearance?.showTikTokBadges === false) return '';
      return badges.map((badge) => {
        if (typeof badge === 'string') return `<span class="badge badgeEmoji">${esc(badge)}</span>`;
        if (badge?.kind === 'image' && badge?.url) return `<span class="badge badgeImage" title="${esc(badge.title || 'badge')}"><img src="${esc(badge.url)}" alt="badge" /></span>`;
        if (badge?.emoji) return `<span class="badge badgeEmoji" title="${esc(badge.title || 'badge')}">${esc(badge.emoji)}</span>`;
        return '';
      }).join('');
    }

    function renderTwitchMessage(text, emotes = {}){
      if (!saved?.appearance?.showTwitchEmotes || !emotes || !Object.keys(emotes).length) return esc(text).replace(/\n/g, '<br>');
      const entries = [];
      for (const [id, ranges] of Object.entries(emotes)) {
        for (const range of String(ranges).split(',')) {
          const [start, end] = range.split('-').map(Number);
          if (Number.isFinite(start) && Number.isFinite(end)) entries.push({ start, end, id });
        }
      }
      entries.sort((a,b)=>a.start-b.start);
      let out = '', cursor = 0;
      const msg = String(text || '');
      for (const emote of entries) {
        if (emote.start < cursor) continue;
        out += esc(msg.slice(cursor, emote.start));
        const token = msg.slice(emote.start, emote.end + 1);
        out += `<img class="twitchEmote" src="https://static-cdn.jtvnw.net/emoticons/v2/${emote.id}/default/dark/1.0" alt="${esc(token)}" title="${esc(token)}" />`;
        cursor = emote.end + 1;
      }
      out += esc(msg.slice(cursor));
      return out.replace(/\n/g, '<br>');
    }

    function renderText(item){
      if (item.platform === 'twitch') return renderTwitchMessage(item.message || '', item.emotes || {});
      return esc(item.message || '').replace(/\n/g, '<br>');
    }

    async function resolveTwitchBadges(roomId, badgesObj){
      const res = await fetch(`/api/twitch/badges?roomId=${encodeURIComponent(roomId || '')}`);
      if (!res.ok) return [];
      const data = await res.json().catch(() => ({}));
      const map = data?.badges || {};
      const out = [];
      for (const [setName, version] of Object.entries(badgesObj || {})) {
        const set = map[setName] || {};
        const entry = set?.versions?.[version] || set?.versions?.['1'] || set?.[version] || set?.['1'] || null;
        if (entry?.image_url_1x) out.push({ kind:'image', url: entry.image_url_1x, title: entry.title || setName });
        else out.push({ emoji:'🏷️', title: setName });
      }
      return out;
    }

    function card(item){
      const el = document.createElement('article');
      el.className = 'item enter';
      el.dataset.id = item.id;
      const avatarUrl = item.avatar || avatar(normalizeHandle(item), item.platform);
      const userName = `<span class="user ${item.platform === 'tiktok' ? 'tiktokName ' + (saved?.appearance?.tiktokUsernameColor || 'white') : ''}">${esc(item.displayName || item.user || 'Usuario')}</span>`;
      const tags = `${userName}${saved?.appearance?.showAtHandle ? `<span class="handle">@${esc(normalizeHandle(item))}</span>` : ''}${renderBadges(item)}<span class="platformTag ${item.platform === 'twitch' ? 'twitch' : 'tiktok'}">${item.platform === 'twitch' ? 'Twitch' : 'TikTok'}</span><span class="time">${time(item.timestamp)}</span>`;
      el.innerHTML = `${saved?.appearance?.showAvatars === false ? '' : `<img class="avatar" src="${esc(avatarUrl)}" alt="avatar" loading="lazy" />`}<div class="content"><div class="top">${tags}</div><div class="text">${renderText(item)}</div></div>`;
      return el;
    }

    function shouldShow(item){
      if (view === 'chat' || view === 'chat-horizontal') return item.kind === 'chat';
      if (view === 'events') return item.kind === 'event';
      if (view === 'gifts') return item.kind === 'gift';
      return true;
    }

    function push(item){
      if (!shouldShow(item)) return;
      list.prepend(card(item));
      const empty = list.querySelector('.emptyState');
      if (empty) empty.remove();
      if (item.kind === 'chat' && Number(saved?.appearance?.messageTtl || 0) > 0) {
        setTimeout(() => {
          const node = list.querySelector(`[data-id="${CSS.escape(item.id)}"]`);
          if (node) node.remove();
        }, Number(saved.appearance.messageTtl));
      }
    }

    function reset(){
      list.innerHTML = '<div class="emptyState"><div><strong>Esperando mensajes</strong><span>Este overlay se actualiza en vivo.</span></div></div>';
    }

    socket.on('connect', () => { status.textContent = 'Conectado'; });
    socket.on('disconnect', () => { status.textContent = 'Desconectado'; });
    socket.on('settings', (data) => {
      if (!data) return;
      if (data?.appearance?.theme) document.body.dataset.theme = data.appearance.theme;
      if (data?.appearance?.font) document.body.dataset.font = data.appearance.font;
      document.body.classList.toggle('no-avatar-frame', data?.appearance?.avatarFrame === false);
      document.body.classList.toggle('hide-avatars', data?.appearance?.showAvatars === false);
    });

    socket.on('chat', async (data) => {
      if (!shouldShow({ kind:'chat' })) return;
      let badges = data?.badges || [];
      if (data?.platform === 'twitch' && data?.badges && !Array.isArray(data.badges)) badges = await resolveTwitchBadges(data.roomId || '', data.badges);
      push({ id: data?.id || `${Date.now()}-${Math.random()}`, kind: 'chat', platform: data?.platform || 'tiktok', displayName: data?.displayName || data?.user || 'Usuario', user: data?.user || data?.displayName || 'Usuario', channel: data?.channel || data?.uniqueId || '', avatar: data?.avatar || '', message: data?.message || '', badges, emotes: data?.emotes || {}, timestamp: data?.timestamp || Date.now() });
    });

    socket.on('event', async (data) => {
      const kind = String(data?.type || 'event').toLowerCase();
      const isGift = ['gift','sub','bits','raid','fanclub','envelope'].includes(kind);
      if (view === 'chat' || view === 'chat-horizontal') return;
      if (view === 'events' && isGift) return;
      if (view === 'gifts' && !isGift) return;
      let badges = data?.badges || [];
      if (data?.platform === 'twitch' && data?.badges && !Array.isArray(data.badges)) badges = await resolveTwitchBadges(data.roomId || '', data.badges);
      push({ id: data?.id || `${Date.now()}-${Math.random()}`, kind: isGift ? 'gift' : 'event', platform: data?.platform || 'tiktok', displayName: data?.displayName || data?.user || 'Usuario', user: data?.user || data?.displayName || 'Usuario', channel: data?.channel || data?.uniqueId || '', avatar: data?.avatar || '', message: data?.message || '', badges, emotes: data?.emotes || {}, timestamp: data?.timestamp || Date.now() });
    });

    socket.on('system', (data) => {
      if (!data?.message) return;
      if (view === 'chat' || view === 'chat-horizontal') return;
      push({ id: `${Date.now()}-${Math.random()}`, kind: 'event', platform: data?.platform || 'tiktok', displayName: 'Sistema', user: 'Sistema', message: data.message, avatar: '', badges: [], emotes: {}, timestamp: Date.now() });
    });

    reset();
  </script>
</body>
</html>
