<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFusion Overlay</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root{--bg:rgba(0,0,0,0);--panel:rgba(13,19,30,.72);--line:rgba(255,255,255,.08);--text:#fff;--muted:#b8c3df;--accent:#7c5cff}
    *{box-sizing:border-box} html,body{height:100%} body{margin:0;background:transparent;color:var(--text);font-family:Segoe UI,Arial,sans-serif;overflow:hidden}
    .wrap{height:100%;padding:18px;display:flex}
    .card{width:100%;background:linear-gradient(180deg, rgba(255,255,255,.04), transparent), var(--panel);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(18px);box-shadow:0 18px 45px rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden}
    .head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title{display:flex;flex-direction:column;gap:2px}.title strong{font-size:18px}.title span{font-size:12px;color:var(--muted)}
    .list{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:auto}
    .item{display:flex;gap:12px;padding:12px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
    .avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#1d2432;flex:0 0 auto}
    .content{min-width:0;flex:1}.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:4px}.user{font-weight:800}.tag,.time{font-size:11px;background:rgba(255,255,255,.06);color:var(--muted);padding:5px 8px;border-radius:999px}.text{word-break:break-word;line-height:1.45}
    .empty{margin:auto;color:var(--muted);text-align:center;padding:28px 10px}.empty strong{display:block;color:var(--text);margin-bottom:6px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="head">
        <div class="title"><strong>Chat Overlay</strong><span>Solo mensajes para capturar en tu live</span></div>
        <div id="status" style="color:var(--muted);font-size:13px">Conectando…</div>
      </div>
      <div class="list" id="list"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const avatar = (seed) => `https://api.dicebear.com/8.x/initials/svg?seed=${encodeURIComponent(seed || 'StreamFusion')}`;
    const esc = (v) => String(v ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    const time = (ts=Date.now()) => new Date(ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
    const items = [];

    function add(data){
      const item = {
        platform: data?.platform || 'tiktok',
        user: data?.displayName || data?.user || 'Usuario',
        displayName: data?.displayName || data?.user || 'Usuario',
        message: data?.message || '',
        avatar: data?.avatar || avatar(data?.displayName || data?.user || 'Usuario'),
        timestamp: data?.timestamp || Date.now(),
      };
      items.unshift(item);
      items.splice(120);
      render();
    }

    function render(){
      if (!items.length){
        list.innerHTML = '<div class="empty"><strong>Esperando mensajes</strong><span>Este overlay muestra solo el chat.</span></div>';
        return;
      }
      list.innerHTML = items.map((it) => `
        <div class="item">
          <img class="avatar" src="${esc(it.avatar)}" alt="avatar" />
          <div class="content">
            <div class="top"><span class="user">${esc(it.displayName)}</span><span class="tag">${it.platform === 'twitch' ? 'Twitch' : 'TikTok'}</span><span class="time">${time(it.timestamp)}</span></div>
            <div class="text">${esc(it.message)}</div>
          </div>
        </div>`).join('');
    }

    socket.on('connect', () => { status.textContent = 'Conectado'; });
    socket.on('disconnect', () => { status.textContent = 'Desconectado'; });
    socket.on('chat', add);
    socket.on('system', (data) => { if (data?.message) add({ platform: data?.platform || 'tiktok', user: 'Sistema', displayName: 'Sistema', message: data.message, timestamp: Date.now() }); });
    render();
  </script>
</body>
</html>
