<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFusion Overlay</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    html, body { width:100%; height:100%; margin:0; background:transparent !important; overflow:hidden; font-family: var(--app-font, Inter, Segoe UI, Arial, sans-serif); }
    body.overlay-mode { background:transparent !important; overflow:hidden; }

    .overlayRoot { width:100%; height:100%; display:flex; padding:12px; box-sizing:border-box; }
    .overlayList {
      width:100%;
      height:100%;
      display:flex;
      flex-direction:column;
      gap:12px;
      overflow:auto;
      scrollbar-width:thin;
      min-height:0;
      align-content:start;
    }
    .overlayList.layout-horizontal {
      flex-direction:row;
      flex-wrap:nowrap;
      overflow-x:auto;
      overflow-y:hidden;
      align-items:stretch;
      scroll-snap-type:x proximity;
    }
    .overlayList.layout-horizontal.direction-right { direction: rtl; }
    .overlayList.layout-horizontal.direction-left { direction: ltr; }
    .overlayList.layout-horizontal .overlayItem { flex:0 0 auto; scroll-snap-align:start; }
    .overlayList.layout-horizontal.size-compact .overlayItem { width:min(300px, 84vw); }
    .overlayList.layout-horizontal.size-normal .overlayItem { width:min(360px, 88vw); }
    .overlayList.layout-horizontal.size-wide .overlayItem { width:min(440px, 92vw); }
    .overlayList.layout-vertical .overlayItem { width:100%; }

    .overlayItem {
      display:flex;
      gap:12px;
      padding:12px;
      border-radius:24px;
      background:rgba(10, 15, 26, .78);
      border:1px solid color-mix(in srgb, var(--item-accent) 42%, rgba(255,255,255,.16));
      box-shadow:0 16px 44px rgba(0,0,0,.24);
      backdrop-filter: blur(16px);
      position:relative;
      overflow:hidden;
      color:var(--text, #eef4ff);
      height:auto;
      min-height:min-content;
    }
    .overlayItem .entryBubble { height:auto; min-height:min-content; }
    .overlayItem .entryText { height:auto; min-height:min-content; }
    .overlayEmpty { margin:auto; text-align:center; color:var(--muted, #aab5d0); padding:24px 12px; }
    .overlayEmpty strong { display:block; color:var(--text, #eef4ff); margin-bottom:6px; font-size:16px; }
  </style>
</head>
<body class="overlay-mode theme-dark">
  <div class="overlayRoot"><div class="overlayList" id="list"></div></div>
  <script src="overlay.js"></script>
</body>
</html>
