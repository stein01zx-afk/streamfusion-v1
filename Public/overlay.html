<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamFusion Overlay</title>
  <link rel="stylesheet" href="style.css" />
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body.overlay-mode{background:transparent;overflow:hidden}
    .overlayWrap{min-height:100%;padding:18px;display:flex}
  </style>
</head>
<body class="overlay-mode theme-dark">
  <div class="overlayWrap">
    <div class="overlayCard">
      <div class="overlayHead">
        <div class="overlayTitle">
          <strong id="overlayTitle">Overlay</strong>
          <span id="overlaySubtitle">Preparando vista...</span>
        </div>
        <div class="overlayModeTag" id="status">Conectando…</div>
      </div>
      <div class="overlayList" id="list"></div>
    </div>
  </div>

  <script>
    const socket = io();
    const list = document.getElementById('list');
    const status = document.getElementById('status');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlaySubtitle = document.getElementById('overlaySubtitle');

    const SETTINGS_KEY = "streamfusion.ui.settings.v2";
    const ACTION_BADGES_KEY = "streamfusion.ui.activity-badges.v1";
    const PLACEHOLDER_AVATAR = (seed, platform = "user") => {
      const label = String(seed || platform || "U").replace(/^@+/, "").replace(/^#+/, "").trim();
      const initial = (label.match(/[A-Za-z0-9]/)?.[0] || String(platform || "U")[0] || "U").toUpperCase();
      const accent = platform === "twitch" ? "#9146ff" : platform === "tiktok" ? "#fe2c55" : "#64748b";
      const bg = platform === "twitch" ? "#0f172a" : platform === "tiktok" ? "#111827" : "#1f2937";
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="${accent}"/><stop offset="100%" stop-color="${bg}"/></linearGradient></defs><rect width="128" height="128" rx="64" fill="url(#g)"/><text x="50%" y="57%" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" fill="#fff">${initial}</text></svg>`;
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    };

    const defaults = {
      personal: {
        theme: "dark",
        font: "inter",
        animation: "slide",
        avatarFrame: "platform",
        bubbleFrame: "platform",
        avatarSize: "md",
        nameSize: "md",
        nameWeight: "800",
        chatHorizontalMode: "normal",
        badgeStyle: "emoji",
        twitchNameColor: "real",
        tiktokNameColor: "white",
        showBadges: true,
        showEmotes: true,
        highlightSupporters: true,
        supporterHighlightStyle: "gold",
        autoClearChat: false,
        clearChatSeconds: 30,
        chatLayout: "vertical",
        chatDirection: "down",
        chatTheme: "cloud",
        highlightStyle: "gold",
        highlightLikes: true,
        highlightFollows: true,
        highlightJoins: true,
        highlightShares: true,
        highlightSystem: true,
        highlightFanclub: true,
        highlightSuperfan: true,
        highlightGifts: true,
        highlightSubs: true,
        highlightBits: true,
        highlightRaids: true,
      },
    };

    const platformColors = {
      tiktok: "#fe2c55",
      twitch: "#9146ff",
    };

    const roleBadges = {
      broadcaster: { emoji: "👑", color: "#f5d063" },
      moderator: { emoji: "🛡️", color: "#22c55e" },
      vip: { emoji: "💎", color: "#38bdf8" },
      subscriber: { emoji: "⭐", color: "#f59e0b" },
      founder: { emoji: "🏁", color: "#fb7185" },
      staff: { emoji: "🧰", color: "#a78bfa" },
      verified: { emoji: "✅", color: "#60a5fa" },
      artist: { emoji: "🎨", color: "#f472b6" },
      premium: { emoji: "✨", color: "#fcd34d" },
      tiktok: { emoji: "🎵", color: "#fe2c55" },
      twitch: { emoji: "🟣", color: "#9146ff" },
    };

    const avatarCache = new Map();
    const pendingAvatarRequests = new Map();
    const items = [];

    const view = new URLSearchParams(location.search).get('view') || 'chat';
    const viewMap = {
      chat: ['Overlay Chat', 'Solo mensajes listos para capturar.'],
      events: ['Overlay Eventos', 'Likes, follows, joins y avisos.'],
      gifts: ['Overlay Regalos', 'Subs, bits, gifts y raids.'],
    };
    const [title, subtitle] = viewMap[view] || viewMap.chat;
    overlayTitle.textContent = title;
    overlaySubtitle.textContent = subtitle;

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (!raw) return structuredClone(defaults);
        const parsed = JSON.parse(raw);
        return mergeDeep(structuredClone(defaults), parsed);
      } catch {
        return structuredClone(defaults);
      }
    }

    let settings = loadSettings();
    let activityBadges = loadJSON(ACTION_BADGES_KEY, { tiktok: {}, twitch: {} });

    function mergeDeep(base, incoming) {
      if (Array.isArray(base) || Array.isArray(incoming)) return incoming ?? base;
      if (typeof base !== "object" || base === null) return incoming ?? base;
      if (typeof incoming !== "object" || incoming === null) return base;
      const out = { ...base };
      for (const key of Object.keys(incoming)) {
        out[key] = key in base ? mergeDeep(base[key], incoming[key]) : incoming[key];
      }
      return out;
    }

    function ESC(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function timeLabel(ts = Date.now()) {
      return new Date(ts).toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false,
      });
    }

    function normalizeUsername(value) {
      return String(value || '')
        .trim()
        .replace(/^https?:\/\/(www\.)?tiktok\.com\/@/i, '')
        .replace(/^https?:\/\/(www\.)?twitch\.tv\//i, '')
        .replace(/^@+/, '')
        .replace(/^#+/, '')
        .split(/[/?#]/)[0]
        .trim();
    }

    function avatarKey(platform, username) {
      return `${String(platform || 'user').toLowerCase()}:${normalizeUsername(username || '').toLowerCase()}`;
    }

    function fallbackAvatar(username, platform) {
      return PLACEHOLDER_AVATAR(`${platform || 'user'}-${username || 'guest'}`);
    }

    function badgeEmoji(key, platform) {
      const lower = String(key || '').toLowerCase();
      if (roleBadges[lower]) return roleBadges[lower].emoji;
      if (lower.includes('mod')) return roleBadges.moderator.emoji;
      if (lower.includes('vip')) return roleBadges.vip.emoji;
      if (lower.includes('sub')) return roleBadges.subscriber.emoji;
      if (lower.includes('staff')) return roleBadges.staff.emoji;
      if (lower.includes('verified')) return roleBadges.verified.emoji;
      if (lower.includes('founder')) return roleBadges.founder.emoji;
      if (lower.includes('tiktok')) return roleBadges.tiktok.emoji;
      if (lower.includes('twitch')) return roleBadges.twitch.emoji;
      return platform === 'tiktok' ? '🎵' : '🟣';
    }

    function normalizeBadgeKeys(raw) {
      if (!raw) return [];
      const items = [];
      const push = (key) => {
        const clean = String(key || '').trim();
        if (clean) items.push(clean);
      };

      if (Array.isArray(raw)) {
        raw.forEach((item) => {
          if (typeof item === 'string') push(item);
          else if (item && typeof item === 'object') push(item.name || item.type || item.label || item.id);
        });
      } else if (typeof raw === 'object') {
        Object.entries(raw).forEach(([key, value]) => {
          if (value === false || value === null || value === undefined) return;
          push(key);
        });
      } else if (typeof raw === 'string') {
        raw.split(/[,\s|]+/).forEach(push);
      }

      return items;
    }

    function badgeText(key) {
      const lower = String(key || '').toLowerCase();
      if (lower.includes('broadcaster')) return 'Broadcaster';
      if (lower.includes('mod')) return 'Mod';
      if (lower.includes('vip')) return 'VIP';
      if (lower.includes('sub')) return 'Sub';
      if (lower.includes('staff')) return 'Staff';
      if (lower.includes('verified')) return 'Verified';
      if (lower.includes('founder')) return 'Founder';
      if (lower.includes('premium')) return 'Premium';
      if (lower.includes('tiktok')) return 'TikTok';
      if (lower.includes('twitch')) return 'Twitch';
      return lower.replace(/[_-]+/g, ' ').replace(/\b\w/g, (m) => m.toUpperCase());
    }

    function badgeChips(raw, platform) {
      if (settings.personal.showBadges === false) return '';
      const style = settings.personal.badgeStyle || 'emoji';
      return normalizeBadgeKeys(raw).map((key) => {
        const content = style === 'compact' ? badgeText(key) : badgeEmoji(key, platform);
        return `<span class="badge">${ESC(content)}</span>`;
      }).join('');
    }

    function activityStore(platform) {
      const key = String(platform || 'tiktok').toLowerCase();
      if (!activityBadges[key]) activityBadges[key] = {};
      return activityBadges[key];
    }

    function saveActivityBadges() {
      localStorage.setItem(ACTION_BADGES_KEY, JSON.stringify(activityBadges || { tiktok: {}, twitch: {} }));
    }

    function activityBadgeEmoji(key) {
      const lower = String(key || '').toLowerCase();
      if (lower.includes('heartme') || lower.includes('superfan')) return '❤️‍🔥';
      if (lower.includes('like')) return '❤️';
      if (lower.includes('follow')) return '👤';
      if (lower.includes('join') || lower.includes('member')) return '👻';
      if (lower.includes('share')) return '🗣';
      if (lower.includes('system')) return '📣';
      if (lower.includes('gift')) return '🎁';
      if (lower.includes('sub') || lower.includes('subscription') || lower.includes('resub')) return '⭐';
      if (lower.includes('bits') || lower.includes('superchat')) return '💎';
      if (lower.includes('raid') || lower.includes('host')) return '⚡';
      if (lower.includes('question')) return '❓';
      if (lower.includes('emote')) return '😄';
      return '✨';
    }

    function activityBadgeType(item) {
      const type = normalizeTypeName(item?.type);
      const group = normalizeTypeName(item?.group);
      const source = `${type} ${group}`;
      if (source.includes('heartme') || source.includes('superfan')) return 'heartme';
      if (source.includes('like')) return 'like';
      if (source.includes('follow')) return 'follow';
      if (source.includes('join') || source.includes('member')) return 'join';
      if (source.includes('share')) return 'share';
      if (source.includes('gift')) return 'gift';
      if (source.includes('sub') || source.includes('subscription') || source.includes('resub')) return 'sub';
      if (source.includes('bits') || source.includes('superchat')) return 'bits';
      if (source.includes('raid') || source.includes('host')) return 'raid';
      if (source.includes('question')) return 'question';
      if (source.includes('emote')) return 'emote';
      if (source.includes('system')) return 'system';
      return '';
    }

    function rememberActivityBadge(item) {
      if (!item) return false;
      const platform = String(item?.platform || 'tiktok').toLowerCase();
      const key = normalizeUsername(item?.displayName || item?.user || item?.uniqueId || '');
      const badge = activityBadgeType(item);
      if (!badge || !key) return false;
      const store = activityStore(platform);
      if (!store[key]) store[key] = [];
      if (!store[key].includes(badge)) {
        store[key].push(badge);
        saveActivityBadges();
      }
      return true;
    }

    function activityBadgeMarkup(item) {
      const platform = String(item?.platform || 'tiktok').toLowerCase();
      const key = normalizeUsername(item?.displayName || item?.user || item?.uniqueId || '');
      if (!key) return '';
      const store = activityBadges?.[platform]?.[key] || [];
      const current = activityBadgeType(item);
      const badges = [...new Set([...store, ...(current ? [current] : [])])]
        .filter(Boolean)
        .map((badge) => `<span class="badge activityBadge activity-${badge}">${ESC(activityBadgeEmoji(badge))}</span>`);
      return badges.join('');
    }

    function itemEmoji(item, kind) {
      const type = String(item?.type || kind || "").toLowerCase();
      const group = String(item?.group || "").toLowerCase();
      if (item?.emoji) return String(item.emoji);
      if (group === 'gift' || type === 'gift') return '🎁';
      if (type === 'sub' || type === 'subscription' || type === 'resub') return '⭐';
      if (type === 'bits') return '💎';
      if (type === 'raid' || type === 'host') return '⚡';
      if (type === 'follow') return '👤';
      if (type === 'share') return '🗣';
      if (type === 'join' || type === 'member') return '👻';
      if (type === 'heartme' || type === 'superfan' || type === 'super_fan') return '❤️‍🔥';
      if (type === 'like') return '❤️';
      if (type === 'system') return '📣';
      if (type === 'question') return '❓';
      if (type === 'emote') return '😄';
      if (kind === 'chat') return '💬';
      return String(item?.platform || '') === 'twitch' ? '🟣' : '🎵';
    }

    function normalizeTypeName(value) {
      return String(value || '').toLowerCase().replace(/[\s_-]+/g, '');
    }

    function isSupporterBadge(item) {
      const badges = normalizeBadgeKeys(item?.badges).map((k) => normalizeTypeName(k));
      const type = normalizeTypeName(item?.type);
      return badges.some((k) => ['subscriber', 'sub', 'member', 'founder', 'premium', 'vip', 'moderator', 'mod', 'verified', 'superfan', 'fanclub'].some((x) => k.includes(x))) ||
        ['subscriber', 'sub', 'resub', 'member', 'fanclub', 'superfan', 'superfanjoin', 'heartme', 'superchat'].some((x) => type.includes(x));
    }

    function isHighlightedEntry(item, kind) {
      const type = normalizeTypeName(item?.type);
      const group = normalizeTypeName(item?.group);
      const highlightStyle = settings.personal.highlightStyle || 'gold';
      const hasSupport = isSupporterBadge(item);
      const supporterOn = settings.personal.highlightSupporters !== false;

      if (kind === 'chat' && hasSupport && supporterOn) {
        return `supporter-highlight support-${settings.personal.supporterHighlightStyle || 'gold'}`;
      }

      const generic = {
        like: settings.personal.highlightLikes !== false,
        follow: settings.personal.highlightFollows !== false,
        join: settings.personal.highlightJoins !== false,
        share: settings.personal.highlightShares !== false,
        system: settings.personal.highlightSystem !== false,
        gift: settings.personal.highlightGifts !== false,
        sub: settings.personal.highlightSubs !== false,
        subscription: settings.personal.highlightSubs !== false,
        resub: settings.personal.highlightSubs !== false,
        bits: settings.personal.highlightBits !== false,
        raid: settings.personal.highlightRaids !== false,
        host: settings.personal.highlightRaids !== false,
        fanclub: settings.personal.highlightFanclub !== false,
        superfan: settings.personal.highlightSuperfan !== false,
        super_fan: settings.personal.highlightSuperfan !== false,
        heartme: settings.personal.highlightFanclub !== false,
        superchat: settings.personal.highlightBits !== false,
      };

      const hit = Object.entries(generic).some(([needle, enabled]) => enabled && (type.includes(needle) || group.includes(needle)));
      if (!hit) return '';
      return `highlight-${highlightStyle}`;
    }

    function resolveNameColor(item) {
      const platform = String(item?.platform || 'tiktok').toLowerCase();
      if (platform === 'twitch') {
        const mode = settings.personal.twitchNameColor || 'real';
        if (mode === 'real') return item?.color || platformColors.twitch;
        if (mode === 'white') return '#f4f7ff';
        return platformColors.twitch;
      }

      const mode = settings.personal.tiktokNameColor || 'white';
      if (mode === 'pink') return platformColors.tiktok;
      if (mode === 'platform') return platformColors.tiktok;
      return '#f4f7ff';
    }

    function parseTwitchEmotes(message, emoteString) {
      const text = String(message ?? '');
      if (!text) return '';
      if (!settings.personal.showEmotes || String(emoteString || '').trim() === '') {
        return ESC(text).replace(/\n/g, '<br>');
      }

      const ranges = [];
      String(emoteString).split('/').forEach((chunk) => {
        const [id, positions] = chunk.split(':');
        if (!id || !positions) return;
        positions.split(',').forEach((pair) => {
          const [start, end] = pair.split('-').map((v) => Number(v));
          if (Number.isFinite(start) && Number.isFinite(end) && start >= 0 && end >= start) {
            ranges.push({ start, end, id });
          }
        });
      });

      if (!ranges.length) return ESC(text).replace(/\n/g, '<br>');
      ranges.sort((a, b) => a.start - b.start || a.end - b.end);

      let out = '';
      let cursor = 0;
      for (const range of ranges) {
        if (range.start < cursor) continue;
        out += ESC(text.slice(cursor, range.start));
        const token = text.slice(range.start, range.end + 1);
        out += `<span class="twitchEmote" title="Twitch emote ${ESC(range.id)}">${ESC(token)}</span>`;
        cursor = range.end + 1;
      }
      out += ESC(text.slice(cursor));
      return out.replace(/\n/g, '<br>');
    }

    function getRenderedMessage(item) {
      const text = String(item?.message ?? '');
      if (String(item?.platform || '').toLowerCase() === 'twitch') {
        return parseTwitchEmotes(text, item?.emotes);
      }
      return ESC(text).replace(/\n/g, '<br>');
    }

    function getRoleAccent(item) {
      const rawKeys = Array.isArray(item.badges)
        ? item.badges.map((b) => String(b || '').toLowerCase())
        : item.badges && typeof item.badges === 'object'
          ? Object.keys(item.badges).map((k) => String(k || '').toLowerCase())
          : [];
      if (rawKeys.some((k) => k.includes('broadcaster'))) return roleBadges.broadcaster.color;
      if (rawKeys.some((k) => k.includes('mod'))) return roleBadges.moderator.color;
      if (rawKeys.some((k) => k.includes('vip'))) return roleBadges.vip.color;
      if (rawKeys.some((k) => k.includes('staff'))) return roleBadges.staff.color;
      if (rawKeys.some((k) => k.includes('sub'))) return roleBadges.subscriber.color;
      if (rawKeys.some((k) => k.includes('verified'))) return roleBadges.verified.color;
      return platformColors[item.platform] || '#7c5cff';
    }

    function avatarForItem(item) {
      return item.avatar || fallbackAvatar(item.displayName || item.user || 'Usuario', item.platform);
    }

    async function primeAvatar(platform, username) {
      const cleanName = normalizeUsername(username || '');
      if (!cleanName) return '';

      const key = avatarKey(platform, cleanName);
      if (avatarCache.has(key)) return avatarCache.get(key);
      if (pendingAvatarRequests.has(key)) return pendingAvatarRequests.get(key);

      const request = fetch(`/api/avatar?platform=${encodeURIComponent(platform || 'user')}&username=${encodeURIComponent(cleanName)}`)
        .then(async (res) => {
          if (!res.ok) throw new Error('Avatar lookup failed');
          return res.json();
        })
        .then((data) => {
          const resolved = String(data?.avatarUrl || '').trim() || fallbackAvatar(cleanName, platform);
          avatarCache.set(key, resolved);
          return resolved;
        })
        .catch(() => {
          const resolved = fallbackAvatar(cleanName, platform);
          avatarCache.set(key, resolved);
          return resolved;
        })
        .finally(() => {
          pendingAvatarRequests.delete(key);
        });

      pendingAvatarRequests.set(key, request);
      return request;
    }

    function applyTheme() {
      document.body.classList.remove('theme-dark', 'theme-matrix', 'theme-neon', 'theme-sunset', 'theme-aurora');
      document.body.classList.add(`theme-${settings.personal.theme || 'dark'}`);
      const map = {
        inter: 'Inter, Segoe UI, Arial, sans-serif',
        system: 'Segoe UI, Arial, sans-serif',
        mono: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
        serif: 'Georgia, "Times New Roman", serif',
        emoji: '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", Segoe UI, Arial, sans-serif',
      };
      document.body.style.setProperty('--app-font', map[settings.personal.font] || map.inter);
      const horizontal = String(settings.personal.chatLayout || 'vertical') === 'horizontal';
      document.body.classList.toggle('chat-horizontal', horizontal);
      document.body.classList.toggle('chat-vertical', !horizontal);
      document.body.classList.remove('chat-horizontal-compact', 'chat-horizontal-normal', 'chat-horizontal-wide');
      document.body.classList.remove('chat-theme-glass', 'chat-theme-cloud', 'chat-theme-bubble', 'chat-theme-neon', 'chat-theme-minimal', 'chat-theme-aurora', 'chat-theme-comic', 'chat-theme-holo', 'chat-theme-ribbon');
      document.body.classList.add(`chat-theme-${settings.personal.chatTheme || 'cloud'}`);
      if (horizontal) document.body.classList.add(`chat-horizontal-${settings.personal.chatHorizontalMode || 'normal'}`);
    }

    function animationClass() {
      return `anim-${settings.personal.animation || 'slide'}`;
    }

    function frameClass() {
      return `frame-${settings.personal.avatarFrame || 'platform'}`;
    }

    function bubbleClass() {
      return `frame-${settings.personal.bubbleFrame || 'platform'}`;
    }

    function itemAccent(item) {
      const frameMode = settings.personal.avatarFrame || 'platform';
      if (frameMode === 'none') return 'transparent';
      if (frameMode === 'role') return getRoleAccent(item);
      return platformColors[item.platform] || '#7c5cff';
    }

    function renderItem(item) {
      const name = item.displayName || item.user || 'Usuario';
      const platform = item.platform || 'tiktok';
      const badges = badgeChips(item.badges, platform);
      const accent = itemAccent(item);
      const roleAccent = getRoleAccent(item);
      const action = item.action || (view === 'chat' ? 'Comentario' : view === 'gifts' ? 'Regalo' : 'Evento');
      const emoji = itemEmoji(item, view);
      const extra = item.gift ? `<div class="entryActionLine"><span class="giftTag">🎁 ${ESC(item.gift)}</span>${item.amount ? `<span class="kindTag">x${ESC(item.amount)}</span>` : ""}</div>` : "";
      const avatarSize = settings.personal.avatarSize || 'md';
      const nameSize = settings.personal.nameSize || 'md';
      const nameWeight = settings.personal.nameWeight || '800';
      return `
        <article class="overlayItem ${animationClass()} ${isHighlightedEntry(item, view === 'chat' ? 'chat' : view === 'gifts' ? 'gift' : 'event')}" style="--item-accent:${accent}; --role-accent:${roleAccent}; --name-color:${resolveNameColor(item)}; --avatar-size:var(--avatar-size-${avatarSize}); --name-size:var(--name-size-${nameSize}); --name-weight:${nameWeight}">
          <div class="entryAvatarWrap ${frameClass()} ${avatarSize === 'sm' ? 'avatar-sm' : avatarSize === 'lg' ? 'avatar-lg' : avatarSize === 'xl' ? 'avatar-xl' : 'avatar-md'}">
            <img class="entryAvatar" src="${ESC(avatarForItem(item))}" alt="avatar" />
          </div>
          <div class="bubble ${bubbleClass()}">
            <div class="top">
              <span class="user">${ESC(name)}</span>
              ${profileBadges ? `<span class="activityBadges">${profileBadges}</span>` : ''}
              <span class="itemEmoji">${ESC(emoji)}</span>
              <span class="platformTag ${platform}">${platform === 'twitch' ? 'Twitch' : 'TikTok'}</span>
              <span class="action">${ESC(action)}</span>
              <span class="time">${timeLabel(item.timestamp)}</span>
            </div>
            <div class="text">${getRenderedMessage(item)}</div>
            ${extra}
            ${badges ? `<div class="meta">${badges}</div>` : ''}
          </div>
        </article>`;
    }

    function render() {
      const autoClear = settings.personal.autoClearChat === true && view === 'chat';
      if (autoClear) {
        const maxAge = Math.max(10, Number(settings.personal.clearChatSeconds || 30)) * 1000;
        const cutoff = Date.now() - maxAge;
        while (items.length && (items[items.length - 1].timestamp || 0) < cutoff) {
          items.pop();
        }
      }

      if (!items.length) {
        list.innerHTML = '<div class="overlayEmpty"><strong>Esperando mensajes</strong><span>Este overlay se actualiza en vivo.</span></div>';
        return;
      }

      list.innerHTML = items.map(renderItem).join('');
    }

    function add(data) {
      const item = {
        platform: data?.platform || 'tiktok',
        type: data?.type || 'chat',
        action: data?.action || (view === 'gifts' ? 'Regalo' : view === 'events' ? 'Evento' : 'Comentario'),
        user: data?.user || data?.displayName || 'Usuario',
        displayName: data?.displayName || data?.user || 'Usuario',
        message: data?.message || '',
        avatar: data?.avatar || '',
        badges: data?.badges || [],
        color: data?.color || '',
        emotes: data?.emotes || '',
        gift: data?.gift || '',
        amount: data?.amount || '',
        timestamp: data?.timestamp || Date.now(),
      };
      items.unshift(item);
      items.splice(240);
      render();
      primeAvatar(item.platform, item.displayName || item.user).then((url) => {
        if (url) {
          item.avatar = url;
          render();
        }
      });
    }

    socket.on('connect', () => { status.textContent = 'Conectado'; });
    socket.on('disconnect', () => { status.textContent = 'Desconectado'; });
    socket.on('chat', (data) => {
      if (view !== 'chat') return;
      add(data);
    });
    socket.on('event', (data) => {
      if (view === 'chat') return;
      const type = String(data?.type || 'system').toLowerCase();
      const isGiftView = view === 'gifts';
      const isEventView = view === 'events';
      const isGift = type === 'gift' || type === 'sub' || type === 'bits' || type === 'raid' || type === 'host';
      if ((isGiftView && !isGift) || (isEventView && isGift)) return;
      if (isEventView && (type === 'gift' || type === 'sub' || type === 'bits' || type === 'raid' || type === 'host')) return;
      add(data);
    });

    socket.on('system', (data) => {
      status.textContent = data?.message ? 'Listo' : status.textContent;
    });

    function applySettingsFromStorage() {
      settings = loadSettings();
      applyTheme();
    }

    window.addEventListener('storage', (ev) => {
      if (ev.key === SETTINGS_KEY && ev.newValue) {
        applySettingsFromStorage();
        render();
      }
    });

    applySettingsFromStorage();
    render();
    setInterval(() => {
      if (settings.personal.autoClearChat && view === 'chat') {
        render();
      }
    }, 5000);
  </script>
</body>
</html>
